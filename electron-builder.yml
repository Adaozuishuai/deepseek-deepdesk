appId: com.deepdesk.app
productName: DeepDesk
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
asar: true
npmRebuild: false
electronLanguages:
  - zh-CN
  - en-US
win:
  target:
    - nsis
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
mac:
  target:
    - dmg
  category: public.app-category.productivity
linux:
  target:
    - AppImage
  category: Utility
